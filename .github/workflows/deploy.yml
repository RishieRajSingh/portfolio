
name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Create portfolio data file
        env:
          PORTFOLIO_DATA: ${{ secrets.PORTFOLIO_DATA }}
        run: |
          if [ -z "$PORTFOLIO_DATA" ]; then
            echo "ERROR: PORTFOLIO_DATA secret is empty or unavailable"
            exit 1
          fi

          mkdir -p resources/data
          printf '%s' "$PORTFOLIO_DATA" > resources/data/portfolioData.json

          echo "Portfolio data file created."

      - name: Verify portfolio data file
        run: |
          if [ ! -s resources/data/portfolioData.json ]; then
            echo "ERROR: portfolioData.json is missing or empty"
            exit 1
          fi

          echo "File exists and is not empty."
          wc -c resources/data/portfolioData.json

          python3 -m json.tool resources/data/portfolioData.json > /dev/null

          echo "JSON is valid."

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
