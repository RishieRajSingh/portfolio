<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title id="page-title"></title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/details.css">
</head>

<body>

    <!-- ==================== HEADER ==================== -->

    <header>
        <nav>

            <div id="nav-name"></div>

            <div>
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#skills">Skills</a>
                <a href="#experience">Experience</a>
                <a href="#projects">Projects</a>
                <a href="#education">Education</a>
                <a href="#achievements">Achievements</a>
                <a href="#certifications">Certifications</a>
                <a href="#contact">Contact</a>
            </div>

        </nav>
    </header>


    <main>

        <!-- ==================== HOME ==================== -->

        <section id="home">

            <div class="hero-content">

                <p id="hero-greeting"></p>

                <h1 id="hero-name"></h1>

                <h2 id="hero-title"></h2>

                <p id="hero-description"></p>

                <div class="hero-actions">
                    <a id="projects-button" href="#projects"></a>
                    <a id="contact-button" href="#contact"></a>
                    <a id="resume-button"></a>
                </div>

            </div>

            <div class="hero-image">
                <img id="hero-profile-image" src="" alt="">
            </div>

        </section>


        <!-- ==================== ABOUT ==================== -->

        <section id="about">

            <h2>About Me</h2>

            <p id="about-description"></p>

            <div id="about-interests"></div>

        </section>


        <!-- ==================== SKILLS ==================== -->

        <section id="skills">

            <h2>Skills</h2>

            <div id="skills-container"></div>

        </section>


        <!-- ==================== EXPERIENCE ==================== -->

        <section id="experience">

            <h2>Experience</h2>

            <div id="experience-container"></div>

        </section>


        <!-- ==================== PROJECTS ==================== -->

        <section id="projects">

            <h2>Projects</h2>

            <div id="projects-container"></div>

        </section>


        <!-- ==================== EDUCATION ==================== -->

        <section id="education">

            <h2>Education</h2>

            <div id="education-container"></div>

        </section>


        <!-- ==================== ACHIEVEMENTS ==================== -->

        <section id="achievements">

            <h2>Achievements</h2>

            <div id="achievements-container"></div>

        </section>


        <!-- ==================== CERTIFICATIONS ==================== -->

        <section id="certifications">

            <h2>Certifications</h2>

            <div id="certifications-container"></div>

        </section>


        <!-- ==================== TECHNICAL WRITING ==================== -->

        <section id="technical-writing">

            <h2>Technical Writing</h2>

            <div id="technical-writing-container"></div>

        </section>


        <!-- ==================== CURRENTLY WORKING ON ==================== -->

        <section id="currently-working">

            <h2>Currently Working On</h2>

            <div id="currently-working-container"></div>

        </section>


        <!-- ==================== CONTACT ==================== -->

        <section id="contact">

            <h2 id="contact-heading"></h2>

            <p id="contact-message"></p>

            <p>
                Email:
                <a id="contact-email"></a>
            </p>

            <p>
                Phone:
                <span id="contact-phone"></span>
            </p>

            <p>
                <a id="github-link">GitHub</a>
                <a id="linkedin-link">LinkedIn</a>
            </p>

        </section>

    </main>


    <!-- ==================== FOOTER ==================== -->

    <footer>

        <p id="footer-text"></p>

    </footer>


    <!-- ==================== JAVASCRIPT ==================== -->

    <script type="module" src="./js/script.js"></script>

</body>

</html>
